[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "love-bugger"
version = "0.1.0"
description = "Camera feasibility and motion tracking for the Love Bugger"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.8,<5", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
love-bugger = "lovebug_interceptor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
